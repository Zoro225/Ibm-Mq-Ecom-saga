
name: Order Saga CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "824225573600"
  IMAGE_TAG: build-${{ github.run_number }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build all Maven services
        run: |
          set -eu

          for service in \
            order-producer-service \
            order-inventory-service \
            order-payment-service \
            order-notification-service
          do
            echo "Building $service"
            mvn -B -f "debezium/$service/pom.xml" clean package
          done

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::824225573600:role/OrderSagaGitHubActionsRole
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images to Docker Hub and ECR
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -eu

          for service in \
            order-producer-service \
            order-inventory-service \
            order-payment-service \
            order-notification-service
          do
            echo "Building $service"

            docker build \
              -t "$DOCKERHUB_USER/$service:$IMAGE_TAG" \
              -t "$ECR_REGISTRY/$service:$IMAGE_TAG" \
              "debezium/$service"

            echo "Pushing $service to Docker Hub"
            docker push "$DOCKERHUB_USER/$service:$IMAGE_TAG"

            echo "Pushing $service to Amazon ECR"
            docker push "$ECR_REGISTRY/$service:$IMAGE_TAG"
          done

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

