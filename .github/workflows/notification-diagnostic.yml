
name: Notification Diagnostic Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build notification service
        run: mvn -B -f debezium/order-notification-service/pom.xml clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push diagnostic image
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: notification-debug-${{ github.run_number }}
        run: |
          set -eu
          docker build \
            -t "$DOCKERHUB_USER/order-notification-service:$IMAGE_TAG" \
            debezium/order-notification-service
          docker push "$DOCKERHUB_USER/order-notification-service:$IMAGE_TAG"
