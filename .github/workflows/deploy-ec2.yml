name: Deploy Order Saga to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing Docker Hub image tag, e.g. build-12"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy application services
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate deployment inputs
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^build-[0-9]+$ ]]; then
            echo "Invalid image tag. Expected build-N, e.g. build-12."
            exit 1
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: EC2_APP_DIR,IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          command_timeout: 15m
          script: |
            set -eu

            : "${EC2_APP_DIR:?Missing EC2_APP_DIR secret}"
            : "${DOCKERHUB_USERNAME:?Missing Docker Hub username}"
            : "${DOCKERHUB_TOKEN:?Missing Docker Hub token}"

            case "$IMAGE_TAG" in
              build-[0-9]*) ;;
              *) echo "Invalid image tag"; exit 1 ;;
            esac

            cd "$EC2_APP_DIR"

            test -d .git
            test -f debezium/docker-compose.yml
            test -f debezium/.env
            test -f debezium/secrets/mqAppPassword
            test -f debezium/secrets/mqAdminPassword

            # Verify infrastructure containers exist.
            for container in \
              ibm-mq \
              postgres-order \
              postgres-inventory \
              postgres-payment \
              postgres-notification; do
              docker inspect "$container" >/dev/null
            done

            # Verify persistent volumes exist.
            for volume in \
              debezium_mq-data \
              debezium_postgres-order-data \
              debezium_postgres-inventory-data \
              debezium_postgres-payment-data \
              debezium_postgres-notification-data; do
              docker volume inspect "$volume" >/dev/null
            done

            cd debezium
            export COMPOSE_PROJECT_NAME=debezium
            export DOCKERHUB_USERNAME IMAGE_TAG

            # Validate the existing EC2 Compose configuration.
            docker compose --env-file .env config --quiet

            # Authenticate to Docker Hub without printing the token.
            printf '%s' "$DOCKERHUB_TOKEN" |
              docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin

            cleanup() {
              docker logout >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            # Pull only the four application images.
            docker compose --env-file .env pull \
              order-producer-service \
              order-inventory-service \
              order-payment-service \
              order-notification-service

            # Recreate only application services.
            # Do not recreate MQ, PostgreSQL, or persistent volumes.
            docker compose --env-file .env up -d \
              --no-build \
              --no-deps \
              order-producer-service \
              order-inventory-service \
              order-payment-service \
              order-notification-service

            # Verify all four services are running.
            for service in \
              order-producer-service \
              order-inventory-service \
              order-payment-service \
              order-notification-service; do
              if ! docker compose --env-file .env ps \
                --status running -q "$service" | grep -q .; then
                docker compose --env-file .env logs --tail=80 "$service" || true
                exit 1
              fi
            done

            docker compose --env-file .env ps
