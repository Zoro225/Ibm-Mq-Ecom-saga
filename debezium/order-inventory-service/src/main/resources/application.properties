
server.port=8081
spring.application.name=order-inventory-service

# IBM MQ
ibm.mq.queueManager=QM1
ibm.mq.channel=DEV.APP.SVRCONN
ibm.mq.connName=${MQ_CONNECTION_NAME:ibm-mq(1414)}
ibm.mq.user=${MQ_USER:app}
ibm.mq.password=${MQ_PASSWORD}
app.mq.concurrency=1-3

# Queues owned by this service
# IN <- new orders arrive from Producer
app.mq.input-queue=DEV.ORDER.QUEUE
# OUT -> forwarded to Payment once stock is confirmed
app.mq.output-queue=DEV.PAYMENT.QUEUE
# OUT -> used when the product is unavailable
app.mq.failed-queue=DEV.ORDER.FAILED.QUEUE
# IN <- Payment tells us to release stock if it fails downstream
app.mq.compensate-queue=DEV.INVENTORY.COMPENSATE.QUEUE

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-inventory:5432/inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.com.order.inventory=DEBUG

