
server.port=8082
spring.application.name=order-payment-service

# IBM MQ
ibm.mq.queueManager=QM1
ibm.mq.channel=DEV.APP.SVRCONN
ibm.mq.connName=${MQ_CONNECTION_NAME:ibm-mq(1414)}
ibm.mq.user=${MQ_USER:app}
ibm.mq.password=${MQ_PASSWORD}
app.mq.concurrency=1-3

# Queues owned by this service
# IN <- confirmed orders arrive from Inventory
app.mq.input-queue=DEV.PAYMENT.QUEUE
# OUT -> forwarded to Notification once payment succeeds
app.mq.output-queue=DEV.NOTIFICATION.QUEUE
# OUT -> used if payment itself fails
app.mq.failed-queue=DEV.ORDER.FAILED.QUEUE
# OUT -> tells Inventory to release reserved stock
app.mq.compensate-queue=DEV.INVENTORY.COMPENSATE.QUEUE

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-payment:5432/payment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

